<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NecxChat — QR Connect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{font-size:28px;font-weight:800;margin-bottom:8px}
.logo span{color:#e11d2e}
.sub{color:#888;font-size:14px;margin-bottom:32px}
#qrbox{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;max-width:400px;width:100%;backdrop-filter:blur(10px)}
#qrbox img{width:100%;max-width:280px;border-radius:12px;background:#fff;padding:12px}
.btn{background:#e11d2e;color:#fff;border:none;border-radius:14px;padding:18px 40px;font-size:18px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 30px rgba(225,29,46,.35)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:wait;box-shadow:none}
.step{color:#aaa;font-size:14px;margin-top:20px;line-height:1.7}
.step b{color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.ok{background:#4ade80}.warn{background:#fbbf24}.bad{background:#f87171}
#status{margin-top:16px;font-size:14px;color:#888;min-height:20px}
.necxy-dev{display:block;text-align:center;margin:40px auto 8px;font-size:11px;letter-spacing:4px;color:#fff;opacity:.28;filter:blur(.4px);text-decoration:none}
</style>
</head>
<body>
<div class="logo">Necx<span>Chat</span></div>
<div class="sub">WhatsApp Connect</div>
<div id="qrbox">
  <div id="content">
    <button class="btn" id="go">QR Generate Karo</button>
    <div class="step">Bas ek tap — QR aayega,<br>WhatsApp se scan karo, kaam shuru!</div>
  </div>
  <div id="status"></div>
</div>
<a href="https://t.me/i_necxy" target="_blank" rel="noopener" class="necxy-dev">NECXY DEVELOPER</a>

<script src="js/relay.js?v=20260930d"></script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const status = (html) => { $("status").innerHTML = html; };
  let qrTimer = null;

  // Init: relay.js auto-handles ?t= from URL. Just wire the button.
  window.addEventListener("DOMContentLoaded", () => {
    if (!window.NECXAWA_RELAY || !window.NECXAWA_RELAY.hasSecret()) {
      $("content").innerHTML = '<p class="step">Link me token nahi hai.<br>Sahi link kholo.</p>';
      return;
    }
    $("go").onclick = generate;
  });
  async function api(method, path, body) {
    if (!window.NECXAWA_RELAY || !window.NECXAWA_RELAY.hasSecret()) throw new Error("no token");
    const res = await window.NECXAWA_RELAY.request(method, path, body);
    if (res.status < 200 || res.status >= 300) {
      const msg = (res.data && (res.data.message || res.data.error)) || ("HTTP " + res.status);
      throw new Error(String(msg));
    }
    return res.data;
  }

  async function generate() {
    const btn = $("go");
    btn.disabled = true;
    $("content").innerHTML = '<p class="step">QR ban raha hai...<br>thoda wait karo</p>';
    status('<span class="dot warn"></span>Connecting...');

    try {
      // 1. Create session (auto-name)
      const name = "phone-" + Date.now().toString(36);
      status('<span class="dot warn"></span>Session bana rahe hain...');
      const s = await api("POST", "/api/sessions", { name });

      // 2. Start session
      status('<span class="dot warn"></span>WhatsApp start ho raha hai...');
      await api("POST", "/api/sessions/" + encodeURIComponent(s.id) + "/start");

      // 3. Wait for QR ready (poll)
      let qr = null;
      for (let i = 0; i < 12; i++) {
        await new Promise(r => setTimeout(r, 4000));
        try {
          const q = await api("GET", "/api/sessions/" + encodeURIComponent(s.id) + "/qr");
          if (q.qrCode) { qr = q.qrCode; break; }
          if (q.status === "ready" || q.status === "connected") {
            $("content").innerHTML = '<p class="step"><b>Connected!</b><br>WhatsApp link ho gaya!</p>';
            status('<span class="dot ok"></span>Connected');
            return;
          }
        } catch(e){}
        status('<span class="dot warn"></span>QR ka wait... (' + (i+1) + '/12)');
      }

      if (!qr) throw new Error("QR nahi mila, dobara try karo");

      // 4. Show QR
      $("content").innerHTML =
        '<p class="step" style="margin-bottom:16px">WhatsApp kholo → <b>Linked devices</b> → <b>Link a device</b><br>aur ye QR scan karo:</p>' +
        '<img src="' + qr + '" alt="WhatsApp QR">' +
        '<p class="step" style="margin-top:16px">QR apne aap refresh hoga</p>';
      status('<span class="dot ok"></span>QR ready — scan karo!');

      // 5. Keep refreshing QR + check if connected
      if (qrTimer) clearInterval(qrTimer);
      qrTimer = setInterval(async () => {
        try {
          const q = await api("GET", "/api/sessions/" + encodeURIComponent(s.id) + "/qr");
          if (q.status === "ready" || q.status === "connected") {
            clearInterval(qrTimer);
            $("content").innerHTML = '<p class="step" style="font-size:20px"><b>Connected!</b><br>WhatsApp link ho gaya!<br>Ab kaam shuru karo!</p>';
            status('<span class="dot ok"></span>Connected');
          } else if (q.qrCode) {
            $("content").querySelector("img").src = q.qrCode;
          }
        } catch(e){}
      }, 15000);

    } catch(e) {
      $("content").innerHTML = '<button class="btn" id="go" onclick="location.reload()">Dobara Try Karo</button>';
      status('<span class="dot bad"></span>Error: ' + e.message);
    }
  }

  // Init: check token, wire button
  window.addEventListener("DOMContentLoaded", () => {
    const token = getToken();
    if (!token) {
      $("content").innerHTML = '<p class="step">Link me token nahi hai.<br>Sahi link kholo.</p>';
      return;
    }
    // Save token for relay.js (?t= format)
    try {
      if (window.NECXAWA_RELAY) window.NECXAWA_RELAY.setSecret("https://x/?t=" + token);
    } catch(e) {
      try { localStorage.setItem("necxawa_relay_secret", token); } catch(e2){}
    }
    $("go").onclick = generate;
  });
})();
</script>
</body>
</html>
